name: Connect validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-connect-app:
    name: Validate commercetools Connect app
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            enabler/package-lock.json
            processor/package-lock.json

      - name: Install enabler dependencies
        run: npm ci --prefix enabler

      - name: Install processor dependencies
        run: npm ci --prefix processor

      - name: Build enabler
        run: npm run build --prefix enabler

      - name: Build processor
        run: npm run build --prefix processor

      - name: Test processor
        run: npm run test --prefix processor

      - name: Test enabler
        run: npm run test --prefix enabler

      - name: Install commercetools CLI
        run: npm install --global @commercetools/cli@0.0.17

      - name: Validate Connect app
        run: commercetools connect validate .
